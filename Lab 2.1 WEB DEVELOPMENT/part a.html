
<!DOCTYPE html>
<html>
<head>

<body>

<h1>Chapter 2 Lab Exercise 2.1 HTML Elements with Attributes</h1>

<!-- Attribute 1: id -->
<p id="intro">Welcome to my website!</p>

<!-- Attribute 2: class -->
<p class="student">I am a university student.</p>
<p class="student">I am learning HTML.</p>

<!-- Attribute 3: href -->
<a href="https://youtube.com">Visit Youtube</a>

<!-- Attribute 4: src -->
<img src="./images/random kid.jpg" width="200">

<!-- Attribute 5: alt -->
<img src="C:\Users\muh24\Desktop\HTML Lab\images\random kid.jpg" alt="My Photo" width="200">

<!-- Attribute 6: title -->
<p title="This is additional information">
    Hover your mouse here.
</p>

<!-- Attribute 7: style -->
<p style="color: blue;">This text is blue.</p>

<!-- Attribute 8: disabled -->
<input type="text" disabled>

<!-- Attribute 9: value -->
<input type="text" value="Hello HTML">

<!-- Attribute 10: checked -->
<input type="checkbox" checked> HTML

</body>
</html>
